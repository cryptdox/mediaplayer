<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1426"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- record grooves: the spinning disc of the player -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3">
    <circle cx="256" cy="262" r="196"/><circle cx="256" cy="262" r="166"/><circle cx="256" cy="262" r="136"/>
  </g>
  <!-- lowercase m: two arches, like a sound wave -->
  <path d="M146 342 V238 A55 55 0 0 1 256 238 V342 M256 238 A55 55 0 0 1 366 238 V342"
        fill="none" stroke="url(#m)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the beat: a small note dot -->
  <circle cx="404" cy="150" r="22" fill="#34d399"/>
</svg>
